# The installer for this commit (recomp-launcher with launcher/launcher.json):
# artifacts on every push to main, release files on a v* tag. The game builds
# on Windows only, so only the Windows installer is made.
name: installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    uses: sp00nznet/recomp-launcher/.github/workflows/installer.yml@main
    with:
      name: RoL-Recomp-Installer
      platforms: windows
