# What can run without the game: syntax, the symbol harvester's self-test, and
# the conformance harness, which skips with a message when _work/game is absent.
name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pefile
      - run: python -m py_compile run_lift.py tools/place.py tools/symbols.py tools/conformance.py
      - run: python tools/symbols.py --selftest
      - run: python tools/conformance.py
      - shell: pwsh
        run: |
          $e = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/tools/setup.ps1", [ref]$null, [ref]$e) | Out-Null
          if ($e) { $e; exit 1 }
